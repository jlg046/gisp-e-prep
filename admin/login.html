<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator Login | GISP-E Prep</title><link rel="stylesheet" href="../assets/site.css"></head><body>
<header class="site"><div class="wrap"><div class="brand"><div><h1>GISP-E / PreGISP Preparation Program</h1><p>Administrator Portal</p></div></div></div></header>
<main><div class="wrap"><div class="login-shell"><div class="login-card"><h2>Administrator login</h2><p>Enter the administrator PIN you selected when configuring the database.</p>
<label>Administrator PIN</label><input id="pin" type="password"><p><button class="btn" id="loginBtn" onclick="login()">Sign in</button></p><p id="msg"></p>
<div class="notice small">This is intentionally a simple program-level login, not Bucknell SSO. Do not use this configuration for sensitive student information.</div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script><script src="../assets/db.js"></script>
<script>async function login(){msg.textContent='';loginBtn.disabled=true;try{await GISPEDB.adminLogin(pin.value);location.href='dashboard.html'}catch(e){msg.className='error';msg.textContent=e.message}finally{loginBtn.disabled=false}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
